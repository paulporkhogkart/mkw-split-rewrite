# Triggered by a version tag push: git tag v0.2.0 && git push --tags
#
# Distribution is Velopack-based (see docs/distribution.md): the app installs and
# updates per-user via `vpk`-produced packages, no `tauri-plugin-updater` involved
# in the normal flow. The one-time v3.0.0 tag additionally builds the legacy NSIS
# installer so existing pre-Velopack clients can migrate through the bridge
# (`src-tauri/src/bridge.rs`) — every later tag skips that pair of steps entirely.
#
# Three jobs:
#   build-python  → PyInstaller portable bundle (unchanged from pre-Tauri)
#   build-tauri   → Copies sidecar, runs a no-bundle tauri build, assembles a
#                   Velopack pack dir (pbenguin.exe + bin/ sidecar), installs the
#                   `vpk` CLI, downloads the previous release as a delta baseline
#                   (best-effort — the first-ever release has nothing to diff
#                   against), then `vpk pack`s full+delta .nupkg, releases.win.json,
#                   and the Setup bootstrapper (renamed to the canonical
#                   pbenguin-win-Setup.exe by the Normalize step). ONLY on the
#                   v3.0.0 tag (`startsWith(github.ref_name, 'v3.0.0')`), it also
#                   builds + signs the legacy NSIS installer and writes the
#                   old-style latest.json update manifest.
#   publish       → Creates the GitHub Release with the Velopack asset set (+ the
#                   NSIS installer and latest.json only on v3.0.0), and on every
#                   *non*-bridge tag re-publishes the committed
#                   .github/bridge-latest.json so straggler NSIS installs that
#                   haven't run the bridge yet keep resolving latest.json.
#
# Required GitHub Secrets (used only by the bridge-only NSIS build/sign step, i.e.
# only ever exercised on the v3.0.0 tag — remove once the post-bridge cleanup
# checklist in docs/distribution.md runs):
#   TAURI_SIGNING_PRIVATE_KEY         minisign private key (from: npm run tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD password chosen during key generation
#
# One-time local setup for the bridge's NSIS signing (not needed once bridge-only
# steps are removed post-v3.0.0):
#   npm install
#   npm run tauri signer generate -- -w ~/.tauri/mkw-tracker.key
#   # Add the private key + password to GitHub Secrets (TAURI_SIGNING_PRIVATE_KEY[_PASSWORD])
#
# Velopack (vpk) notes:
#   - packId is "pbenguin"; vpk's own default Setup filename is "pbenguin-Setup.exe"
#     (no "-win-" infix) — the "Normalize Setup asset name" step renames it to
#     "pbenguin-win-Setup.exe", which is what bridge.rs's SETUP_ASSET constant and
#     the frontend both expect, hard-failing if that isn't unambiguous.
#   - Delta baseline comes from `vpk download github` against this same repo;
#     the first-ever Velopack release has nothing to download against, so that
#     step is `continue-on-error: true` and vpk just falls back to a full pack.

name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:        # manual "force build" — bypasses the change-detection gate

permissions:
  contents: write

jobs:
  # ── 0. Decide whether this tag actually touches pbenguin (the desktop app) ────
  #   A version tag is ALSO how the Pi self-updates the server/bot/site, so a tag
  #   whose only real changes live in the server/bot/site dirs (pi/, web/, server/,
  #   deploy/) or *.md docs must NOT rebuild or re-release the desktop app (that
  #   would push a pointless auto-update to every client). set_version.py rewrites
  #   the 6 version files on every bump, so those never count as a pbenguin change.
  #   (GitHub ignores on.push.paths for tag pushes — hence this in-workflow guard.)
  changes:
    name: Detect pbenguin changes
    runs-on: ubuntu-latest
    outputs:
      pbenguin: ${{ steps.detect.outputs.pbenguin }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # full history + tags, to diff against the previous release

      - name: Detect
        id: detect
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Manual run → always build.
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "manual dispatch → building pbenguin"
            echo "pbenguin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Previous release = most recent tag reachable from this tag's parent.
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "no previous tag → building pbenguin (first release / safe default)"
            echo "pbenguin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "comparing $prev..$TAG"

          # Files set_version.py rewrites on every bump — never a pbenguin change alone.
          version_files='^(package\.json|package-lock\.json|pyproject\.toml|src-tauri/Cargo\.toml|src-tauri/Cargo\.lock|src-tauri/tauri\.conf\.json)$'

          echo "--- changed files ---"
          git diff --name-only "$prev" "$TAG" || true
          echo "---------------------"

          # pbenguin change = any changed file that is NOT a version-bump file,
          # NOT under a server/bot/site dir (pi/ web/ server/ deploy/), and NOT a *.md doc.
          relevant="$(git diff --name-only "$prev" "$TAG" \
            | grep -Ev "$version_files" \
            | grep -Ev '^(pi/|web/|server/|deploy/)' \
            | grep -Eiv '\.md$' || true)"

          if [ -n "$relevant" ]; then
            echo "pbenguin-relevant changes:"
            echo "$relevant"
            echo "pbenguin=true" >> "$GITHUB_OUTPUT"
          else
            echo "only server/bot/site + *.md (+ version bump) → skipping pbenguin build/release"
            echo "pbenguin=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. Build Python sidecar ──────────────────────────────────────────────────
  build-python:
    name: Build Python sidecar (Windows x64)
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.pbenguin == 'true'

    outputs:
      version: ${{ steps.version.outputs.value }}
      zip_name: ${{ steps.names.outputs.zip }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime + build deps
        run: pip install -r requirements.txt pyinstaller

      - name: Install ffmpeg (for bundling into sidecar)
        run: choco install ffmpeg-full --no-progress -y

      - name: Add real ffmpeg binary to PATH
        shell: pwsh
        run: |
          # Find the real ffmpeg.exe under the choco lib directory (not the bin\ shim).
          $real = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Filter "ffmpeg.exe" -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.DirectoryName -notlike "*\bin*" } |
                  Sort-Object Length -Descending |
                  Select-Object -First 1
          if (-not $real) {
            # Fallback: any ffmpeg.exe, largest wins (shims are tiny, real binary is ~100 MB)
            $real = Get-ChildItem "C:\ProgramData\chocolatey" -Filter "ffmpeg.exe" -Recurse -ErrorAction SilentlyContinue |
                    Sort-Object Length -Descending |
                    Select-Object -First 1
          }
          Write-Host "Real ffmpeg: $($real.FullName) ($($real.Length) bytes)"
          $real.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build with PyInstaller
        run: pyinstaller mkw_tracker.spec --noconfirm

      - name: Debug bundle contents
        shell: bash
        run: |
          echo "=== ffmpeg path and version ==="
          where ffmpeg || echo "ffmpeg not in PATH"
          ffmpeg -version 2>&1 | head -3
          echo "=== ffprobe path ==="
          where ffprobe || echo "ffprobe not in PATH"
          echo "=== pip packages ==="
          pip list
          echo "=== _internal size ==="
          du -sh dist/mkw-tracker/_internal
          echo "=== _internal top-level contents (sorted by size) ==="
          du -sh dist/mkw-tracker/_internal/* | sort -rh | head -30

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Determine artifact names
        id: names
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.value }}
          echo "zip=mkw-tracker-v${VERSION}-windows-x64.zip" >> "$GITHUB_OUTPUT"

      - name: Package portable bundle
        shell: bash
        run: |
          cd dist
          7z a "../${{ steps.names.outputs.zip }}" mkw-tracker/

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-bundle
          path: ${{ steps.names.outputs.zip }}
          retention-days: 1

  # ── 2. Build Tauri app + Velopack pack (+ bridge-only NSIS on v3.0.0) ────────
  build-tauri:
    name: Build Tauri installer (Windows x64)
    runs-on: windows-latest
    needs: [changes, build-python]
    if: needs.changes.outputs.pbenguin == 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download Python sidecar bundle
        uses: actions/download-artifact@v8
        with:
          name: python-bundle

      - name: Extract sidecar into src-tauri/sidecar/
        shell: bash
        run: |
          VERSION=${{ needs.build-python.outputs.version }}
          7z x "mkw-tracker-v${VERSION}-windows-x64.zip" -o"sidecar_tmp/"
          mkdir -p src-tauri/sidecar
          cp sidecar_tmp/mkw-tracker/mkw-tracker-engine.exe \
             src-tauri/sidecar/mkw-tracker-engine.exe
          cp -r sidecar_tmp/mkw-tracker/_internal src-tauri/sidecar/_internal

      - name: Verify sidecar binary present
        shell: bash
        run: ls -lh src-tauri/sidecar/

      - name: Stamp version into tauri.conf.json
        shell: bash
        run: |
          python - <<'EOF'
          import json, os
          cfg = json.load(open("src-tauri/tauri.conf.json"))
          cfg["version"] = os.environ["VERSION"]
          json.dump(cfg, open("src-tauri/tauri.conf.json", "w"), indent=2)
          EOF
        env:
          VERSION: ${{ needs.build-python.outputs.version }}

      - name: Generate placeholder icons (if not committed)
        run: python scripts/gen_icons.py

      - name: Install npm dependencies
        # npm install (not ci): package-lock.json is authored by a different npm minor than
        # CI runs (node 25/npm 11.6.2 locally vs the runner's npm), and they disagree about
        # which optional wasm-runtime deps (@emnapi/*, esbuild platform binaries) must be
        # pinned in the lock — so `npm ci`'s strict in-sync gate aborts. `npm install`
        # reconciles the lock against package.json and installs, which is fine for a build.
        run: npm install --no-audit --no-fund

      - name: Build Tauri app (no bundle)
        run: npm run tauri build -- --no-bundle

      - name: Assemble Velopack pack directory
        shell: bash
        run: |
          set -euo pipefail
          ls -lh src-tauri/target/release/*.exe
          mkdir -p pack/bin
          # tauri CLI names the binary after productName; fall back to the cargo name.
          cp src-tauri/target/release/pbenguin.exe pack/pbenguin.exe 2>/dev/null \
            || cp src-tauri/target/release/mkw-tracker.exe pack/pbenguin.exe
          cp src-tauri/sidecar/mkw-tracker-engine.exe pack/bin/mkw-tracker-engine.exe
          cp -r src-tauri/sidecar/_internal pack/bin/_internal

      - name: Install vpk CLI
        run: dotnet tool install -g vpk

      - name: Verify vpk CLI is on PATH
        run: vpk --version

      - name: Download previous release (delta baseline)
        # First Velopack release has no baseline — that's fine, vpk just skips deltas.
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o velopack_releases

      - name: Velopack pack
        run: >-
          vpk pack -u pbenguin -v ${{ needs.build-python.outputs.version }}
          -p pack -e pbenguin.exe
          -i src-tauri/icons/icon.ico --packTitle pbenguin
          -o velopack_releases

      - name: Warn if no delta package was generated
        # Non-fatal: a missing delta just means this release ships full-size only
        # (worse update experience, not a broken one) — but silent is how it stays
        # unnoticed, so surface it loudly instead of failing the job.
        shell: bash
        run: |
          set -euo pipefail
          if ! ls velopack_releases/pbenguin-*-delta.nupkg >/dev/null 2>&1; then
            echo "::warning::no delta generated — baseline download likely failed; release will be full-size only"
          fi

      - name: Normalize Setup asset name
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # bridge.rs SETUP_ASSET downloads exactly this name; vpk's default differs
          # across versions ({packId}-Setup.exe per current docs), so pin it here.
          if [ ! -f velopack_releases/pbenguin-win-Setup.exe ]; then
            setups=(velopack_releases/*Setup.exe)
            [ ${#setups[@]} -eq 1 ] || { echo "expected exactly one Setup exe, got: ${setups[*]:-none}"; exit 1; }
            mv "${setups[0]}" velopack_releases/pbenguin-win-Setup.exe
          fi
          ls -lh velopack_releases/

      - name: List Velopack output (debug)
        shell: bash
        run: ls -lh velopack_releases/

      # ── Bridge-only (v3.0.0): last NSIS artifacts so old clients update into the bridge ──
      - name: Build NSIS installer (bridge release only)
        if: startsWith(github.ref_name, 'v3.0.0')
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List NSIS bundle output (debug)
        if: startsWith(github.ref_name, 'v3.0.0')
        shell: bash
        run: ls src-tauri/target/release/bundle/nsis/

      - name: Generate update manifest (bridge release only)
        if: startsWith(github.ref_name, 'v3.0.0')
        shell: bash
        run: |
          python - <<'EOF'
          import json, os, glob, datetime
          from urllib.parse import quote

          bundle_dir = "src-tauri/target/release/bundle/nsis"
          exe_files  = glob.glob(f"{bundle_dir}/*x64-setup.exe")
          sig_files  = glob.glob(f"{bundle_dir}/*x64-setup.exe.sig")

          if not exe_files or not sig_files:
              raise FileNotFoundError(
                  f"Installer or signature not found in {bundle_dir}. Files present: "
                  + str(os.listdir(bundle_dir))
              )

          installer  = os.path.basename(exe_files[0])
          signature  = open(sig_files[0]).read().strip()

          version = os.environ["VERSION"]
          repo    = os.environ["REPO"]
          tag     = os.environ["TAG"]

          manifest = {
              "version": version,
              "notes": f"See https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": signature,
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{quote(installer)}",
                  }
              },
          }

          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)

          print(f"Manifest written for {installer}")
          EOF
        env:
          VERSION: ${{ needs.build-python.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}

      - name: Upload NSIS installer artifact
        if: startsWith(github.ref_name, 'v3.0.0')
        uses: actions/upload-artifact@v7
        with:
          name: tauri-installer
          path: |
            src-tauri/target/release/bundle/nsis/*x64-setup.exe
            src-tauri/target/release/bundle/nsis/*x64-setup.exe.sig
          retention-days: 1

      - name: Upload update manifest artifact
        if: startsWith(github.ref_name, 'v3.0.0')
        uses: actions/upload-artifact@v7
        with:
          name: update-manifest
          path: latest.json
          retention-days: 1

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-release
          path: velopack_releases/
          retention-days: 1

  # ── 3. Publish GitHub Release ─────────────────────────────────────────────────
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [changes, build-python, build-tauri]
    if: needs.changes.outputs.pbenguin == 'true'

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-bundle

      - uses: actions/download-artifact@v8
        with:
          name: velopack-release
          path: velopack_releases

      - uses: actions/download-artifact@v8
        if: startsWith(github.ref_name, 'v3.0.0')
        with:
          name: tauri-installer

      - uses: actions/download-artifact@v8
        if: startsWith(github.ref_name, 'v3.0.0')
        with:
          name: update-manifest

      # After v3.0.0 ships, its latest.json gets committed as .github/bridge-latest.json
      # (post-bridge checklist). Re-publishing it on every later release keeps
      # releases/latest/download/latest.json resolving for straggler NSIS installs,
      # which then funnel through the bridge.
      - uses: actions/checkout@v6
        with:
          path: repo
      - name: Pin bridge latest.json for stragglers
        if: ${{ !startsWith(github.ref_name, 'v3.0.0') }}
        shell: bash
        run: |
          if [ -f repo/.github/bridge-latest.json ]; then
            cp repo/.github/bridge-latest.json latest.json
          else
            echo "::error::post-bridge checklist step 1 not done: commit .github/bridge-latest.json from the v3.0.0 release so NSIS stragglers keep resolving latest.json"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Hyphenated tags (v3.0.0-rc.1) publish as PRERELEASES: they never become
          # "latest", so live NSIS clients resolving releases/latest/download/latest.json
          # can't auto-update into a rehearsal build. Their per-tag download URLs still
          # work, which is all the bridge rehearsal needs.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            *.zip
            *.exe
            *.exe.sig
            latest.json
            velopack_releases/*

      - name: Fail if release is missing Velopack assets
        shell: bash
        run: |
          ls velopack_releases/*.nupkg velopack_releases/releases.win.json
          test -f velopack_releases/pbenguin-win-Setup.exe
