<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pork phone</title>
<link rel="stylesheet" href="/static/phone.css?v=1">
</head><body>
<main class="page">
  <header class="head">
    <span class="brand">pork phone</span>
    <span class="pill" id="pill" hidden><span class="dot" id="dot"></span><span id="pill-text"></span></span>
  </header>

  <section class="callwrap">
    <button class="callbtn" id="callbtn" aria-label="call">
      <svg id="callicon" viewBox="0 0 24 24">
        <path class="p-call" d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/>
        <path class="p-end" d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.29-.71.29s-.53-.11-.71-.29L.29 13.08c-.18-.18-.29-.43-.29-.71s.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71s-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29s-.53-.11-.71-.29c-.79-.74-1.68-1.36-2.66-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.16 9.25 13.6 9 12 9z"/>
      </svg>
    </button>
    <span class="sub" id="caption">press to call</span>
  </section>

  <section class="settings">
    <h2 class="ttl">Settings</h2>
    <div class="ctl">
      <div class="ctl-head">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>
        <span class="ctl-label">Microphone</span>
        <button class="testbtn" id="mic-listen">Listen</button>
      </div>
      <div class="meter"><div class="lv" id="mic-level"></div></div>
      <select id="mic-sel" class="dev-sel" aria-label="microphone"></select>
    </div>
    <div class="ctl">
      <div class="ctl-head">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <span class="ctl-label">Output</span>
        <button class="testbtn" id="spk-test">Test</button>
      </div>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="volume">
      <select id="spk-sel" class="dev-sel" aria-label="output device"></select>
    </div>
  </section>
</main>
<script src="/static/phone.js?v=1"></script>
</body></html>
