[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mkw-tracker"
version = "1.2.0"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.scripts]
mkw-tracker = "mkw_tracker.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mkw_tracker*"]
