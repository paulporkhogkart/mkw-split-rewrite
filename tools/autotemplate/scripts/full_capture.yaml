# Full Template Capture Script
# Converted from tools/autotemplate/scripts/prompt.md
#
# ── Step semantics ──────────────────────────────────────────────────────────────
#
#   press: BUTTON          tap and release; combined with wait: N to pause after
#   hold: BUTTON           hold for `duration` seconds then release
#   wait: N                pause N seconds (standalone, or after press/replay)
#   replay: "file.json"    play back a recorded input JSON from recordings/
#   macro: name            expand a named macro from the `macros` section
#
#   screenshot: id         save full 1080p frame → screenshots/{lang}/id.png
#   tell: screen           capture primary screen-detection ROI → screens/{lang}/id.png
#                          also saves a full screenshot → screenshots/{lang}/id.png
#   roi: screen            capture ALL detection ROIs for screen → screens/{lang}/
#   char: "Name"           capture character name text ROI → characters/{lang}/name.png
#                          (runner deduplicates within the current language pass)
#   costume: "Name"        capture costume name text ROI → costumes/{lang}/name.png
#                          (deduplicates per language pass)
#   kart: "Name"           capture kart name text ROI → karts/{lang}/name.png
#   course: "Name"         capture course name text ROI → courses/{lang}/name.png
#   reconnect: true        reconnect controller to Switch via stored MAC address
#
# ROI coordinates are shared/configured once and reused across all languages.
# The captured template image and full screenshot are always saved per-language.
# Multiple keys on one step are processed in order: nav → wait → captures.
# Steps with only capture keys (no press/hold/wait) capture the current frame.

name: "Full Template Capture"
version: 1

# ── Languages ──────────────────────────────────────────────────────────────────
# Processed in order. First language must match the current console language.
# change_language steps run between passes; never before the first or after the last.

languages:
  - { id: en_uk, name: "English (UK/AU)" }
  - { id: en_us, name: "English (US)" }
  - { id: fr_fr, name: "Français (France)" }
  - { id: fr_ca, name: "Français (Canada)" }
  - { id: de,    name: "Deutsch" }
  - { id: es_es, name: "Español (España)" }
  - { id: es_la, name: "Español (Latinoamérica)" }
  - { id: it,    name: "Italiano" }
  - { id: nl,    name: "Nederlands" }
  - { id: pt_pt, name: "Português (Portugal)" }
  - { id: pt_br, name: "Português (Brasil)" }
  - { id: ru,    name: "Русский" }
  - { id: ja,    name: "日本語" }
  - { id: zh_tw, name: "中文 (繁體)" }
  - { id: zh_cn, name: "中文 (简体)" }
  - { id: ko,    name: "한국어" }
  - { id: pl,    name: "Polish/English" }
  - { id: th,    name: "Thai/English" }

# ── Macros ─────────────────────────────────────────────────────────────────────

macros:

  # Reset track-selection cursor to the top-left corner of the grid.
  # Tilts R stick down to zoom out (same effect as X, avoids accidental double-press).
  reset_cursor:
    - { wait: 1.0 }
    - { rstick_down: 3.0 }
    - { wait: 1.0 }
    - { hold: DPAD_LEFT,  duration: 5.0 }
    - { hold: DPAD_UP,    duration: 3.5 }

  # Use this instead of reset_cursor when already on the course map (no X press needed)
  reset_map_cursor:
    - { wait: 1.0 }
    - { rstick_down: 3.0 }
    - { wait: 1.0 }
    - { hold: DPAD_LEFT,  duration: 5.0 }
    - { hold: DPAD_UP,    duration: 3.5 }

# ── Language Change ─────────────────────────────────────────────────────────────
# Starting state: HOME screen (MKW closed, cursor back at home row).
# Navigates to System Settings → Language, selects the next language,
# confirms the console restart, then reconnects the controller.

change_language:
  # Navigate from GALLERY icon to System Settings cog (4 rights)
  - { press: DPAD_RIGHT, wait: 1.0 }
  - { press: DPAD_RIGHT, wait: 1.0 }
  - { press: DPAD_RIGHT, wait: 1.0 }
  - { press: DPAD_RIGHT, wait: 1.0 }
  - { press: A, duration: 0.3,          wait: 5.0 }   # open System Settings
  # Scroll down to Language row (16 presses)
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: A, duration: 0.3,          wait: 1.0 }   # open Language submenu
  # Hand off to the operator: use arrow keys in the console to scroll to the
  # correct language entry, then press Enter to resume.
  - { manual_scroll: true }
  - { press: A, duration: 0.3,          wait: 1.0 }   # select language
  - { press: DPAD_DOWN,  wait: 1.0 }
  - { press: A, duration: 0.3,          wait: 1.0 }   # confirm
  - { press: A, duration: 0.3,          wait: 20.0 }  # confirm restart — console reboots (~20 s)
  - { reconnect: true,   wait: 5.0 }   # reconnect controller via stored MAC
  - { press: A, duration: 0.3,          wait: 5.0 }   # HOME screen loaded; MKW hovered

# ── Main Flow ──────────────────────────────────────────────────────────────────
# Starting state: HOME screen, MKW hovered and most recently opened, not running.
# Executed once per language.

flow:

  # ── Launch ────────────────────────────────────────────────────────────────────
  - { press: A, duration: 0.3, wait: 1.5 }
  - { press: A, duration: 0.3, wait: 20.0 }   # wait for title screen to fully load

  # ── Title screen ──────────────────────────────────────────────────────────────
  - { screenshot: title, tell: title }

  - { press: A, duration: 0.3, wait: 3.0 }

  # ── Main menu ─────────────────────────────────────────────────────────────────
  - { screenshot: mainmenu, roi: mainmenu }

  - { press: A, duration: 0.3, wait: 3.0 }

  # ── Singleplayer menu ─────────────────────────────────────────────────────────
  - { screenshot: singleplayer, tell: singleplayer }

  # Navigate down to Time Trials (2 presses)
  - { press: DPAD_DOWN, wait: 0.5 }
  - { press: DPAD_DOWN, wait: 0.5 }

  # ── Time Trials selection ─────────────────────────────────────────────────────
  - { screenshot: timetrials, tell: timetrials }

  - { press: A, duration: 0.3, wait: 3.0 }

  # ── Character select ──────────────────────────────────────────────────────────
  - { screenshot: character_screen, tell: character_screen }

  # ── Characters and costumes ───────────────────────────────────────────────────
  # Navigation: DPAD_RIGHT moves to the next character; DPAD_DOWN moves to the
  # next row. Blank grid slots have no char/costume fields.
  # The runner deduplicates: if a char or costume name has already been saved
  # this language pass, the capture is skipped.

