# Character name template capture — English
#
# Prerequisites:
#   - Game is on the character select screen
#   - The first character in the roster is highlighted (top-left)
#
# Fill in `preamble` with whatever button presses get you FROM your current
# game state (e.g. title screen) TO the character select screen.
# Leave it empty if you start the runner already on character select.

name: "Characters (English)"
category: characters
language: en

preamble: []
# Example preamble from title screen (adjust delays to your game version):
# preamble:
#   - { A: 0.1 }          # press A on title
#   - { wait: 3.0 }       # wait for main menu
#   - { A: 0.1 }          # Select profile / continue
#   - { wait: 2.0 }
#   - { A: 0.1 }          # Time Trials
#   - { wait: 1.0 }
#   - { A: 0.1 }          # Select Character
#   - { wait: 1.5 }       # wait for character select to load

# ---
# Each item:
#   name         : display name (informational only)
#   file         : filename to save (no .png)
#   before       : button presses to navigate FROM previous item TO this one
#   capture_wait : seconds to wait after `before` before snapping the frame
#
# The very first item's `before` is run from the start position defined
# by `preamble` — typically the first character already highlighted.
# ---

items:

  - name: "Baby Daisy"
    file: baby_daisy
    before: []          # already on first character after preamble
    capture_wait: 0.4

  - name: "Baby Luigi"
    file: baby_luigi
    before:
      - { DPAD_RIGHT: 0.05 }
      - { wait: 0.3 }
    capture_wait: 0.4

